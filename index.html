*{box-sizing:border-box}:root{--ac:var(--k0);--paper:var(--k1);--line:var(--k2)}body{margin:0;height:100vh;font:14px system-ui;color:var(--k3)}#app{height:100%}

button:disabled{opacity:.45;cursor:default}button:disabled:hover{border-color:var(--k4)}

a{color:inherit;text-decoration:none}small{color:var(--k6)}
.home{max-width:1000px;margin:0 auto;padding:40px 20px}.home h1{font:600 28px Georgia,serif;display:inline-block;margin:0 20px 24px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:14px}

.tf1{--h:215;border-radius:14px;padding:3px 11px;font-size:13px;background:hsl(var(--h) 55% 95%);border-color:hsl(var(--h) 40% 80%)}.tf1 small{color:var(--k8);margin-left:3px}.tf1.on{background:hsl(var(--h) 55% 38%);border-color:hsl(var(--h) 55% 38%);color:var(--k5)}.tf1.on small{color:var(--k9)}
.tg{--h:215;display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:1px 8px;border-radius:10px;background:hsl(var(--h) 60% 91%);color:hsl(var(--h) 55% 24%);border:1px solid hsl(var(--h) 45% 80%);white-space:nowrap}
.tg button{border:0;background:none;padding:0 0 0 2px;color:inherit;font-size:14px;line-height:1}.tg.add{cursor:pointer;background:var(--k5)}.tg.add:hover{background:hsl(var(--h) 60% 93%)}
.ctg{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}.ctg .tg{cursor:pointer}.ctg .tg:hover{filter:brightness(.95)}
.grp{margin:0 0 22px}.grp h2{font:600 15px system-ui;margin:0 0 8px;display:flex;gap:8px;align-items:center}.grp h2 small{font-weight:400}
.tgs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;min-height:26px}.modal #ti{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--k4);border-radius:6px}
.tsg{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:8px}
.card .mb{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--k8);font-size:18px;line-height:1;padding:2px 7px;border-radius:6px}.card .mb:hover{background:var(--k10);color:var(--ac)}
.pop{position:fixed;z-index:60;background:var(--k5);border:1px solid var(--k4);border-radius:8px;box-shadow:0 8px 24px rgba(20,28,45,.2);padding:4px;display:flex;flex-direction:column;min-width:170px}
.pop button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:5px}.pop button:hover{background:var(--k11)}.pop .dn{color:var(--k12)}.pop .dn:hover{background:var(--k13)}
.card{position:relative;border:1px solid var(--k4);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:90px}
.card:hover{border-color:var(--ac);background:var(--k14)}.card b{font-family:Georgia,serif;font-size:16px}
.top>b{min-width:0;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card{min-width:0;overflow:hidden}.card b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden;overflow-wrap:anywhere;padding-right:30px;line-height:1.3}.card small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ctg{min-width:0}
.proj{height:100%;display:grid;grid-template-columns:212px 1fr 1fr;grid-template-rows:auto 1fr auto}
.proj>.top{grid-row:1}.proj>#tr,.proj>#g1,.proj>#ed,.proj>#g2,.proj>#pdf,.proj>#g3,.proj>#ag,.proj>#hv{grid-row:2}
.proj>#tr{grid-column:1}.proj>#g1{grid-column:2}.proj>#ed{grid-column:3}.proj>#g2{grid-column:4}.proj>#pdf{grid-column:5}.proj>#g3{grid-column:6}.proj>#ag{grid-column:7}
.proj.h-tr>#tr,.proj.h-ed>#ed,.proj.h-pdf>#pdf,.gut[hidden]{display:none!important}
#pdf .bar{flex-wrap:wrap}#pdf .bar label,#pdf .bar button{white-space:nowrap}
.gut{cursor:col-resize;background:var(--k15);border-left:1px solid var(--k4);border-right:1px solid var(--k4);touch-action:none;min-width:0;outline:none}.gut:hover,.gut.on,.gut:focus-visible{background:var(--k16)}

.top{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--k4)}.top b{flex:1;font:600 17px Georgia,serif}
#tr{border-right:1px solid var(--k4);display:flex;flex-direction:column;min-height:0}#tr .bar,#pdf .bar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--k4)}
#tr .tabs{display:flex;border-bottom:1px solid var(--k4)}#tr .tabs button{flex:1;border:0;border-radius:0;background:var(--k18);padding:6px 4px;font-size:12px;color:var(--k19);cursor:pointer}#tr .tabs button.on{background:var(--k5);color:var(--k3);font-weight:600;box-shadow:inset 0 -2px var(--ac)}
#tr.ov>.bar,#tr.ov>#tl{display:none}#olb{padding:6px 10px;font-size:12px;color:var(--k19);border-bottom:1px solid var(--k20)}#olb[hidden],#ol[hidden]{display:none}#ol{list-style:none;margin:0;padding:4px 0;overflow:auto;flex:1}
#ol li{padding:3px 8px;cursor:pointer;font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ol li:hover{background:var(--k11)}#ol li.on{background:var(--k10);box-shadow:inset 3px 0 var(--ac)}#ol li.sec span{font-weight:600}#ol li.mark{color:var(--k8);font-style:italic}#ol li.stm{color:var(--k21)}#ol li.stm small{color:var(--k22)}#ol li.none{color:var(--k22);cursor:default;white-space:normal}
#tl{list-style:none;margin:0;padding:4px 0;overflow:auto;flex:1}#tl li{padding:4px 8px;cursor:pointer;display:flex;justify-content:space-between}
#tl li{user-select:none;white-space:nowrap}#tl li>span:first-child{overflow:hidden;text-overflow:ellipsis}
#tl li.f:hover,#tl li.dir:hover{background:var(--k11)}#tl li.on{background:var(--k10)}#tl li.dir{cursor:default;color:var(--k6)}#tl li.root{color:var(--k3);font-weight:600}
#tl li.over,#tl li.over:hover{background:var(--k23);outline:1px dashed var(--ac);outline-offset:-1px}
.x{color:var(--k24);visibility:hidden;flex:none;padding-left:6px}.x span{cursor:pointer;padding:0 3px}.x span:hover{color:var(--ac)}li:hover>.x{visibility:visible}
#ed{position:relative;overflow:auto;min-width:0;border-right:1px solid var(--k4)}#ed .cm-editor{height:100%}
#pdf{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
/* Archivo principal */
#tl li.main>span:first-child{font-weight:600}.ms{color:var(--k25);font-weight:400}.mfs{width:100%;font:inherit;border:1px solid var(--k4);border-radius:6px;padding:4px}.mfs option{padding:4px 6px}
/* Plegado de secciones y entornos */
.cm-foldGutter{min-width:18px}.cm-foldGutter .cm-gutterElement{cursor:pointer;color:var(--k26);font-size:16px;font-weight:600;text-align:center;opacity:.6;transition:opacity .1s}.cm-gutters:hover .cm-foldGutter .cm-gutterElement,.cm-foldGutter .cm-gutterElement:hover{opacity:1;color:var(--ac)}
.cm-foldPlaceholder{background:var(--k10);color:var(--ac);border:1px solid var(--k27);border-radius:10px;padding:0 8px;margin:0 4px;font-size:.85em;cursor:pointer}.cm-foldPlaceholder:hover{background:var(--k28)}
/* Corrector ortográfico */
.spellmenu{position:fixed;z-index:80;min-width:190px;max-width:320px;background:var(--k5);border:1px solid var(--k4);border-radius:8px;box-shadow:0 8px 28px rgba(20,28,45,.22);padding:4px;font-size:14px}
.spellmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;cursor:pointer;font:inherit}.spellmenu button:hover,.spellmenu button:focus-visible{background:var(--k10)}
.spellmenu small{display:block;padding:6px 10px;color:var(--k6)}.spellmenu hr{border:0;border-top:1px solid var(--k29);margin:4px 0}
.spr{display:flex;gap:8px;align-items:center;margin:4px 0 8px}.spl{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-bottom:10px}.spl label{display:flex;gap:6px;align-items:center}
.spw{display:block;color:var(--k30);margin-top:6px}
#sp.on{background:var(--k10);border-color:var(--k16)}
/* Visor de PDF (pdf.js) */
.pdfsearch{position:absolute;top:50px;right:20px;z-index:6;display:flex;gap:4px;align-items:center;background:var(--k5);border:1px solid var(--k4);border-radius:8px;box-shadow:0 6px 20px rgba(20,28,45,.2);padding:5px 6px}.pdfsearch[hidden]{display:none}
.pdfsearch input{width:190px;border:1px solid var(--k4);border-radius:5px;padding:4px 7px;font:inherit}.pdfsearch #sqc{font-size:12px;color:var(--k19);min-width:62px;text-align:center}.pdfsearch button{padding:2px 8px}
.pdfmarks{position:absolute;inset:0;pointer-events:none;z-index:2}.pdfmark{position:absolute;background:rgba(255,226,0,.42);border-radius:2px;mix-blend-mode:multiply}.pdfmark.cur{background:rgba(255,140,0,.55);outline:2px solid rgba(230,100,0,.9)}
#pv{flex:1;min-height:0;overflow:auto;background:var(--k31);position:relative}
.pdfpages{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;min-width:max-content;box-sizing:border-box}
.pdfpage{position:relative;background:var(--k5);box-shadow:0 1px 5px rgba(20,30,60,.3);flex:none}.pdfpage canvas{display:block}
.pdfempty{color:var(--k6);text-align:center;padding:30px 16px;font-size:14px}
.pdfv.onlink .textLayer{cursor:help}.pdfprev{position:fixed;z-index:70;background:var(--k5);border:1px solid var(--k32);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.28);overflow:hidden;pointer-events:none}.pdfprev img{display:block;max-width:none}.pdfprev .cap{font-size:11px;color:var(--k6);background:var(--k18);padding:2px 8px;border-top:1px solid var(--k33)}
.pdfhl{position:absolute;background:rgba(255,213,0,.4);border:1px solid rgba(210,150,0,.95);border-radius:3px;pointer-events:none;z-index:3;animation:pdfhl 2.6s ease-out forwards}
@keyframes pdfhl{0%,60%{opacity:1}100%{opacity:0}}
.textLayer{color-scheme:only light;position:absolute;text-align:initial;inset:0;overflow:clip;line-height:1;letter-spacing:normal;word-spacing:normal;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:1;--min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size));--min-font-size-inv:calc(1 / var(--min-font-size))}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0;user-select:text}
.textLayer>:not(.markedContent),.textLayer .markedContent span:not(.markedContent){z-index:1;--font-height:0;font-size:calc(var(--text-scale-factor) * var(--font-height));--scale-x:1;--rotate:0deg;transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv))}
.textLayer .markedContent{display:contents}
.textLayer ::selection{background:rgba(40,90,220,.3)}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;user-select:none}
.pdfzoom{display:inline-flex;align-items:center;gap:2px}.pdfzoom button{padding:2px 9px}

.rfrow{display:flex;gap:6px}.rfrow input{flex:1;min-width:0;padding:6px 8px;font-size:14px}.rfm{margin:8px 0;font-size:13px;color:var(--k34);min-height:1em}.rfm.bad{color:var(--k35)}.rft{width:100%;box-sizing:border-box;font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--k36);border-radius:6px}.rfl{display:block;margin:6px 0;font-size:13px}.rfn{font-size:11px;color:var(--k8);margin:8px 0}
#lg{max-height:34%;overflow:auto;font-size:13px;border-top:1px solid var(--k4);background:var(--k5)}#lg:empty{display:none}

#lg .lh.bad{background:var(--k13);color:var(--k38)}#lg .lh.ok{background:var(--k39);color:var(--k40)}#lg .lh.warn{background:var(--k41);color:var(--k42)}
.lts{display:flex;gap:4px}#lg .lt{padding:1px 8px;font-size:11px;font-weight:600;border:1px solid rgba(0,0,0,.18);border-radius:10px;background:rgba(255,255,255,.65);cursor:pointer;color:inherit}#lg .lt.on{background:var(--k5);border-color:rgba(0,0,0,.45)}
.er{padding:5px 10px;border-bottom:1px solid var(--k20);border-left:3px solid var(--k43)}.er.w{border-left-color:var(--k44)}
.er .em,.er .at{display:inline}.er .at{margin-left:8px}.er{cursor:default}.er .cx,.er .hn,.er .cm{display:none}.er.open .cx,.er.open .hn{display:block}.er.open .cm{display:flex}.er:has(.cx,.hn){cursor:pointer}.er:has(.cx,.hn) .em::before{content:"▸ ";color:var(--k22)}.er.open .em::before{content:"▾ "}
.er .em{font-weight:600;color:var(--k38)}.er.w .em{color:var(--k42);font-weight:500}.er .at{font-size:12px;color:var(--k7);margin:1px 0}

.er code,.er .cx{font:12px/1.4 ui-monospace,Menlo,monospace}.er .cx{margin:4px 0 0;padding:3px 6px;background:var(--k45);border-radius:4px;white-space:pre-wrap;word-break:break-word}
.spin{display:inline-block;vertical-align:middle;width:12px;height:12px;margin-right:7px;border:2px solid var(--k46);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}.spin[hidden]{display:none}#co.busy{background:var(--k10);border-color:var(--k47)}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

.er .cm{display:flex;gap:6px;align-items:center;margin-top:5px}.er .cm code{background:var(--k11);padding:3px 8px;border-radius:4px;user-select:all}.er .cm button{padding:2px 8px;font-size:12px}
#lg details{border-bottom:1px solid var(--k20)}#lg summary{cursor:pointer;padding:6px 12px;font-size:12px;color:var(--k7)}#lg pre{margin:0;padding:8px 12px;font-size:11px;white-space:pre-wrap;word-break:break-word;background:var(--k49);max-height:260px;overflow:auto}

/* Historial de cambios: sustituye al editor y al PDF mientras está abierto */
